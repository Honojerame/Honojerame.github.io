name: RTL verification
on:
  push:
    paths: ['engineering/**', '.github/workflows/rtl.yml']
  pull_request:
    paths: ['engineering/**', '.github/workflows/rtl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engineering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install open-source RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys make python3
      - name: Differential and transaction verification
        run: make test
      - name: Structural lint
        run: make lint
      - name: Generic synthesis and structural checks
        run: make synth
      - name: Regenerate measured report
        run: make report
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rtl-verification-evidence
          path: |
            engineering/results
            engineering/docs/results.md
          if-no-files-found: error
